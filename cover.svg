<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 878">
  <defs>
    <radialGradient id="paperBg" cx="30%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#fbf6e8"/>
      <stop offset="55%" stop-color="#f3e8c9"/>
      <stop offset="100%" stop-color="#e8d9ad"/>
    </radialGradient>
    <pattern id="ruled" width="1080" height="40" patternUnits="userSpaceOnUse">
      <rect width="1080" height="40" fill="url(#paperBg)"/>
      <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#6b5a50" stroke-width="0.7" stroke-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1080" height="878" fill="url(#ruled)"/>

  <!-- Soft amber blooms -->
  <circle cx="160" cy="140" r="180" fill="#c9892e" fill-opacity="0.06"/>
  <circle cx="940" cy="720" r="220" fill="#c9892e" fill-opacity="0.05"/>

  <!-- Decorative frame -->
  <rect x="60" y="60" width="960" height="758" fill="none"
        stroke="#a76e18" stroke-width="2" stroke-opacity="0.35"
        stroke-dasharray="6 8" rx="14"/>

  <!-- Title brushstroke underline -->
  <path d="M 220 540 Q 540 580 860 540" fill="none"
        stroke="#a76e18" stroke-width="6" stroke-opacity="0.55" stroke-linecap="round"/>

  <g font-family="'Zen Kurenaido','Yu Mincho',serif" text-anchor="middle" fill="#3b2f2a">
    <text x="540" y="280" font-size="46" fill="#a76e18" letter-spacing="10">～ 近所ごはんノート ～</text>
    <text x="540" y="460" font-size="120" font-weight="700">町のごはんを、</text>
    <text x="540" y="610" font-size="84" font-weight="700">みんなで記録する。</text>
    <text x="540" y="730" font-size="32" fill="#6b5a50" letter-spacing="4">地元の個人店を応援するノート</text>
  </g>

  <!-- Small bowl icon -->
  <g transform="translate(540, 160)">
    <ellipse cx="0" cy="20" rx="60" ry="14" fill="#a76e18" fill-opacity="0.18"/>
    <path d="M -55 0 Q 0 50 55 0 Z" fill="none" stroke="#a76e18" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M -20 -18 Q -15 -32 -10 -18" fill="none" stroke="#a76e18" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M 0 -22 Q 5 -36 10 -22" fill="none" stroke="#a76e18" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M 18 -18 Q 23 -32 28 -18" fill="none" stroke="#a76e18" stroke-width="2" stroke-opacity="0.5"/>
  </g>
</svg>
