<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fbf6e8"/>
      <stop offset="60%" stop-color="#f5ebcf"/>
      <stop offset="100%" stop-color="#ecdfb8"/>
    </radialGradient>
    <pattern id="lines" width="640" height="32" patternUnits="userSpaceOnUse">
      <rect width="640" height="32" fill="url(#paper)"/>
      <line x1="0" y1="31.5" x2="640" y2="31.5" stroke="#6b5a50" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="640" height="640" fill="url(#lines)"/>

  <circle cx="320" cy="320" r="240" fill="none" stroke="#a76e18" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="320" cy="320" r="220" fill="none" stroke="#a76e18" stroke-width="1.2" stroke-opacity="0.4"/>

  <g font-family="'Zen Kurenaido','Yu Mincho',serif" text-anchor="middle" fill="#3b2f2a">
    <text x="320" y="220" font-size="44" fill="#a76e18" letter-spacing="6">～ご近所～</text>
    <text x="320" y="340" font-size="120" font-weight="700">ごはん</text>
    <text x="320" y="450" font-size="64" fill="#a76e18">ノート</text>
  </g>

  <g stroke="#a76e18" stroke-width="2" stroke-opacity="0.6" fill="none">
    <path d="M 140 500 Q 320 540 500 500"/>
  </g>
</svg>
